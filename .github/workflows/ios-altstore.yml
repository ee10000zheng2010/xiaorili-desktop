name: Build iOS AltStore IPA

on:
  workflow_dispatch:
  push:
    tags:
      - "ios-*"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web assets and sync iOS
        run: npm run cap:ios

      - name: Build unsigned iOS app
        run: |
          cd ios/App
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package AltStore IPA
        run: |
          cd ios/App
          rm -rf Payload xiaorili-altstore.ipa
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry xiaorili-altstore.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: xiaorili-ios-altstore
          path: ios/App/xiaorili-altstore.ipa
